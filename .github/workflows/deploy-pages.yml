name: Deploy to Pages

# Stage 7 — production.
#
# Every merge to `main` publishes the storefront and the live pipeline
# dashboard to GitHub Pages. For the automated lane this is the moment a
# change reaches production without any human having looked at it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          # Pages serves this project from /<repo>/, so assets need that prefix.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_REPO_OWNER: ${{ github.repository_owner }}
          VITE_REPO_NAME: ${{ github.event.repository.name }}
          # Compiled in so the running app can notice when a newer build has
          # shipped and prompt for a reload — Pages caches index.html for 10
          # minutes, which would otherwise show a stale app mid-demo.
          VITE_BUILD_SHA: ${{ github.sha }}
        run: npm run build

      - name: Add SPA fallback
        # The app uses hash routing, so a path-style deep link such as
        # /pipeline is a 404 on Pages. Copying index.html here would render
        # the *store* instead — quietly showing the wrong page to anyone the
        # presenter sent a link to. Translate the path into the hash route
        # and redirect, so /pipeline lands on /#/pipeline.
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          cat > dist/404.tmpl <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <title>Redirecting…</title>
              <script>
                (function () {
                  var base = '__BASE__';
                  var path = location.pathname.indexOf(base) === 0
                    ? location.pathname.slice(base.length)
                    : location.pathname.replace(/^\//, '');
                  location.replace(base + '#/' + path.replace(/^\/+/, '') + location.search);
                })();
              </script>
            </head>
            <body>
              <p>Redirecting to <a id="home" href="__BASE__">the demo</a>…</p>
            </body>
          </html>
          HTML
          # Not `sed -i`: its argument handling differs between GNU and BSD,
          # which would make this step impossible to test outside the runner.
          sed "s|__BASE__|${VITE_BASE_PATH}|g" dist/404.tmpl > dist/404.html
          rm dist/404.tmpl

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          {
            echo "## Deployed to production"
            echo ""
            echo "${{ steps.deployment.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"

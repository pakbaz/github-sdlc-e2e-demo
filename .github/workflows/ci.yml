name: ci

# The required status check on `main`.
#
# The ruleset names this check by the job's workflow name, so do NOT rename
# this workflow without also updating scripts/demo/setup.sh.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Workflow shell syntax
        # A `run:` block can be valid YAML and still be broken shell. Actions
        # would only find out mid-deploy, so check it here instead.
        run: ./scripts/ci/check-workflows.sh

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 5

      - name: Summary
        if: always()
        run: |
          {
            echo "## ci"
            echo ""
            echo "lint · typecheck · unit · build · browser tests"
          } >> "$GITHUB_STEP_SUMMARY"
